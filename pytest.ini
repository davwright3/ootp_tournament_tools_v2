# pytest.ini
[pytest]
pythonpath = .
addopts =
    -ra -q
    --cov=.
    --cov-report=term-missing
    --cov-branch
    --cov-fail-under=40
    --cov-config=pytest.ini
testpaths = tests
filterwarnings=
    ignore:.*distutils.*:DeprecationWarning

[coverage:run]
branch = True
source=
    au_ootp_tournament_utilities_v2
    utils
omit =
    */utils/view_utils/*
    *\utils\view_utils\*
    */tests/*
    *\tests\*

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 75
