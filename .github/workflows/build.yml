name: Build, Package and Release

on:
  push:
    tags:
      - 'v*' # Triggers a release when we push with a version tag

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean main.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes

      - name: Run Inno Setup Compiler
        shell: pwsh
        run: |
          iscc installer/installer.iss

      - name: Rename Windows Installer
        shell: pwsh
        run: |
          $version="${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "installer\Output\*.exe" "release/AU_Tournament_Utilities-$version-windows-x64.exe"

      - name: List Output Files
        run: dir installer/Output

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable With PyInstaller
        run: |
          pyinstaller --clean main.spec

      - name: Create ZIP of Built App
        run: |
          cd dist
          zip -r main-macos.zip ./*

      - name: Rename macOS Artifact
        run: |
          version="${{ github.ref_name }}"
          mkdir -p release
          mv dist/main-macos.zip "release/AU-Tournament-Utilities-${version}-macos-universal.zip"

      - name: List Release Files
        run: ls -la release

      - name: Create macOS Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
